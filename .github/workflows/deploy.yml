name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # manual redeploy, e.g. after the bucket is rebuilt

permissions:
  contents: read
  id-token: write # lets the job request GitHub's OIDC token

# One deploy at a time: two quick pushes can't race each other's sync.
concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Upload site and clear the cache
        env:
          BUCKET: ${{ secrets.SITE_BUCKET }}
          DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws s3 sync site/ "s3://$BUCKET" --delete --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*" > /dev/null
